<meta charset="utf-8">
<title>Aefos Addons</title>
<style>
  /* The IDE decides light or dark; every colour is a variable so the host can
     hand us its own palette without this file knowing which theme it is in. */
  :root {
    --bg:        #1e1e1e;
    --fg:        #e7e7e7;
    --muted:     #9a9a9a;
    --line:      #333333;
    --panel:     #252526;
    --accent:    #2f6fd0;
    --accent-fg: #ffffff;
    --ok:        #4a9a58;
    --warn:      #c98a2b;
    --err:       #d05a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---- header: search + store filter + refresh ------------------------- */
  header { padding: 10px 12px 0; flex: 0 0 auto; }
  .row1 { display: flex; gap: 8px; align-items: center; }
  input[type=search], select {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font: inherit; outline: none;
  }
  input[type=search] { flex: 1 1 auto; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  .iconbtn {
    background: transparent; color: var(--muted); border: 1px solid transparent;
    border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit;
  }
  .iconbtn:hover { color: var(--fg); border-color: var(--line); }

  /* ---- two levels of tabs ---------------------------------------------
     WHERE it comes from on top (Official / Custom), WHAT it is underneath
     (built from the data). Origin is the OUTER question because it is the one
     with consequences: the official store is ours and cannot be repointed;
     everything else is a store somebody added. */
  nav {
    display: flex; gap: 2px; margin-top: 10px;
    border-bottom: 1px solid var(--line);
  }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; padding: 7px 12px; cursor: pointer;
    white-space: nowrap;
  }
  nav button:hover { color: var(--fg); }
  nav button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
  nav .count { color: var(--muted); font-size: 11px; margin-left: 5px; }
  #origins { margin-top: 8px; border-bottom: none; }
  #origins button { font-weight: 600; padding: 5px 12px; border-radius: 4px; }
  #origins button[aria-selected=true] {
    background: var(--panel); color: var(--fg); border-bottom-color: transparent;
  }
  .hint {
    color: var(--muted); font-size: 12px; padding: 22px 12px; text-align: center;
  }
  .hint button { margin-top: 10px; }

  /* ---- the list -------------------------------------------------------- */
  main { flex: 1 1 auto; overflow-y: auto; padding: 4px 0 12px; }
  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
  }
  .item:hover { background: var(--panel); }
  .meta { flex: 1 1 auto; min-width: 0; }
  .name { font-weight: 600; }
  .desc, .sub {
    color: var(--muted); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sub { font-size: 11px; margin-top: 1px; }
  .act { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding-top: 2px; }
  button.primary {
    background: var(--accent); color: var(--accent-fg); border: none;
    border-radius: 3px; padding: 4px 12px; font: inherit; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.12); }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px 9px; font: inherit; cursor: pointer;
  }
  button.ghost:hover { color: var(--fg); }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  .done { color: var(--ok); font-size: 12px; }

  /* ---- the stores panel ------------------------------------------------
     Same window, second view. Managing stores inside the store means the one
     control this window has is the one that draws everything - no second form
     to keep in step with this one, and no trip through Options to add a share. */
  .panelhead {
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 12px 8px; border-bottom: 1px solid var(--line);
  }
  .panelhead h2 { font-size: 14px; margin: 0; flex: 1 1 auto; }
  .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); border: 1px solid var(--line);
    border-radius: 3px; padding: 1px 5px;
  }
  .off .name, .off .sub { opacity: .55; }
  .addform { padding: 12px; border-top: 1px solid var(--line); }
  .addform h3 { font-size: 12px; margin: 0 0 8px; color: var(--muted); }
  .addform .fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .addform input[type=text] {
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 8px; font: inherit; outline: none;
  }
  .addform input[type=text]:focus { border-color: var(--accent); }
  #srcname { flex: 0 0 140px; }
  #srcloc  { flex: 1 1 240px; min-width: 160px; }
  .why { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .bad-inline { color: var(--err); font-size: 12px; margin-top: 8px; }

  .banner {
    margin: 8px 12px 0; padding: 7px 10px; border-radius: 4px;
    border: 1px solid var(--warn); color: var(--warn); font-size: 12px;
  }
  .empty { color: var(--muted); padding: 28px 12px; text-align: center; }

  /* ---- the log strip, only while something is running ------------------ */
  #log {
    flex: 0 0 auto; max-height: 34vh; overflow-y: auto; display: none;
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 12px; font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px; white-space: pre-wrap;
  }
  #log.on { display: block; }
  #log .bad { color: var(--err); }
</style>

<header id="head">
  <div class="row1">
    <input type="search" id="q" placeholder="Search addons" autocomplete="off">
    <select id="store"><option value="">All stores</option></select>
    <button class="iconbtn" id="refresh" title="Reload every store">Refresh</button>
    <button class="iconbtn" id="sources" title="Add or disable a store">Stores&hellip;</button>
  </div>
  <nav id="origins"></nav>
  <nav id="tabs"></nav>
</header>
<div id="banners"></div>
<main id="list"></main>
<main id="stores" hidden></main>
<div id="log"></div>

<script>
"use strict";
(function () {
  // The host speaks to this page through window.aefosStore, and the page speaks
  // back through postMessage. Nothing here fetches anything: the CLI is the only
  // thing that knows how to read a store, and it runs on the Delphi side.
  var state = { addons: [], errors: [], origin: "official", tab: null,
                q: "", store: "", busy: null,
                view: "list",     // "list" (addons) or "stores"
                sources: [] };

  function post(msg) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify(msg));
    } else {
      console.log("[aefos-store]", JSON.stringify(msg));   // browser preview
    }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // Type -> tab label. The words are the GALLERY's words: somebody who browsed
  // aefos.dev and then opened this window is looking at the same three groups,
  // and a private name for them here would read as a different catalogue.
  // Unknown types are NOT dropped and NOT folded into a neighbour: they get a
  // tab under their own name, which is the whole reason the type travels as a
  // string.
  var LABEL = { all: "All", command: "Commands", mcp: "MCP Servers",
                tool: "Tools", skill: "Skills" };
  function label(kind) {
    if (LABEL[kind]) return LABEL[kind];
    return kind ? kind.charAt(0).toUpperCase() + kind.slice(1) : "Other";
  }

  // The pseudo-type that means "do not filter by type". Not a kind any store can
  // publish, so it can never collide with a real one.
  var ALL = "all";

  // The middle dot the subtitles already use, built from its code point so this
  // file stays pure ASCII - see the note in actionHtml about why that matters.
  var SEP = " " + String.fromCharCode(183) + " ";

  function kinds() {
    var seen = [], i;
    for (i = 0; i < state.addons.length; i++) {
      if (!inOrigin(state.addons[i])) continue;
      var k = state.addons[i].kind || "other";
      if (seen.indexOf(k) < 0) seen.push(k);
    }
    // A stable order for the ones we know, then whatever else arrived, so the
    // tabs do not jump around between refreshes.
    var known = ["command", "mcp", "tool", "skill"];
    seen.sort(function (a, b) {
      var ia = known.indexOf(a), ib = known.indexOf(b);
      if (ia < 0 && ib < 0) return a < b ? -1 : 1;
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    });
    // "All" leads, like the gallery. Only when there is something to be all OF:
    // one type plus an All that shows the same rows is two tabs saying one thing.
    if (seen.length > 1) seen.unshift(ALL);
    return seen;
  }

  // Origin is not a filter the user can widen: an addon from a store somebody
  // added never appears among the official ones, whatever it calls itself.
  function inOrigin(a) { return (a.origin || "custom") === state.origin; }

  function matches(a) {
    if (!inOrigin(a)) return false;
    if (state.store && a.source !== state.store) return false;
    if (!state.q) return true;
    var hay = (a.slug + " " + a.name + " " + (a.description || "") + " " +
               a.source).toLowerCase();
    return hay.indexOf(state.q) >= 0;
  }

  // The type tab an addon belongs to, All included.
  function inTab(a, tab) {
    return tab === ALL || (a.kind || "other") === tab;
  }

  function renderTabs() {
    var ks = kinds(), nav = document.getElementById("tabs"), html = "", i;
    if (ks.indexOf(state.tab) < 0) state.tab = ks.length ? ks[0] : null;
    for (i = 0; i < ks.length; i++) {
      var n = 0, j;
      for (j = 0; j < state.addons.length; j++) {
        if (inTab(state.addons[j], ks[i]) && matches(state.addons[j])) n++;
      }
      html += '<button data-kind="' + esc(ks[i]) + '" aria-selected="' +
        (ks[i] === state.tab) + '">' + esc(label(ks[i])) +
        '<span class="count">' + n + "</span></button>";
    }
    nav.innerHTML = html;
  }

  // The two outer tabs always BOTH exist, even when one is empty: "Custom" that
  // vanishes when you have no store of your own is a feature you never find out
  // about, and finding it is the whole point of the tab.
  function renderOrigins() {
    var nav = document.getElementById("origins"), html = "", i, k;
    var names = { official: "Official", custom: "Custom" };
    var order = ["official", "custom"];
    for (i = 0; i < order.length; i++) {
      k = order[i];
      var n = 0, j;
      for (j = 0; j < state.addons.length; j++) {
        if ((state.addons[j].origin || "custom") === k) n++;
      }
      html += '<button data-origin="' + k + '" aria-selected="' +
        (k === state.origin) + '">' + names[k] +
        '<span class="count">' + n + "</span></button>";
    }
    nav.innerHTML = html;
  }

  function renderStores() {
    var sel = document.getElementById("store"), seen = [], i;
    for (i = 0; i < state.addons.length; i++) {
      if (!inOrigin(state.addons[i])) continue;
      if (seen.indexOf(state.addons[i].source) < 0) seen.push(state.addons[i].source);
    }
    var html = '<option value="">All stores</option>';
    for (i = 0; i < seen.length; i++) {
      html += '<option value="' + esc(seen[i]) + '"' +
        (seen[i] === state.store ? " selected" : "") + ">" + esc(seen[i]) + "</option>";
    }
    sel.innerHTML = html;
  }

  function renderBanners() {
    // A store that could not be read is shown, never swallowed: an unreachable
    // store and an empty list look identical, and one of them is a lie.
    var html = "", i;
    for (i = 0; i < state.errors.length; i++) {
      if ((state.errors[i].origin || "custom") !== state.origin) continue;
      html += '<div class="banner">' + esc(state.errors[i].source) + ": " +
        esc(state.errors[i].message) + "</div>";
    }
    document.getElementById("banners").innerHTML = html;
  }

  function actionHtml(a) {
    var id = esc(a.source + "/" + a.slug);
    // Non-ASCII travels as \u escapes: this page is embedded in a Delphi build
    // that eight compilers read, and a literal glyph is one encoding surprise
    // away from being mojibake on somebody's screen.
    if (state.busy === a.source + "/" + a.slug) {
      return '<button class="primary" disabled>Working\u2026</button>';
    }
    if (a.state === "update") {
      return '<button class="primary" data-do="update" data-id="' + id + '">Update</button>' +
             '<button class="ghost" data-do="remove" data-id="' + id + '">Remove</button>';
    }
    if (a.state === "installed") {
      return '<span class="done">\u2713 Installed</span>' +
             '<button class="ghost" data-do="remove" data-id="' + id + '">Remove</button>';
    }
    return '<button class="primary" data-do="install" data-id="' + id + '">Install</button>';
  }

  function renderList() {
    var out = "", i, shown = 0;
    for (i = 0; i < state.addons.length; i++) {
      var a = state.addons[i];
      if (!inTab(a, state.tab) || !matches(a)) continue;
      shown++;
      // On the All tab the type is the one thing the row no longer says, so it
      // joins the subtitle - otherwise a command and an MCP server look alike.
      var sub = a.source;
      if (state.tab === ALL) sub = label(a.kind || "other") + SEP + a.source;
      if (a.version) sub += " \u00b7 v" + a.version;
      if (a.installed && a.installedVersion && a.installedVersion !== a.version) {
        sub += " \u00b7 installed v" + a.installedVersion;
      }
      if (a.trust === "official") sub += " \u00b7 official";
      out += '<div class="item"><div class="meta">' +
        '<div class="name">' + esc(a.name || a.slug) + "</div>" +
        '<div class="desc">' + esc(a.description || a.slug) + "</div>" +
        '<div class="sub">' + esc(sub) + "</div></div>" +
        '<div class="act">' + actionHtml(a) + "</div></div>";
    }
    if (!shown) out = emptyHtml();
    document.getElementById("list").innerHTML = out;
  }

  // An empty Custom tab is not a failure, it is the normal state of a fresh
  // install - so it says what a custom store IS and offers the way to add one,
  // instead of the blank "nothing here" that reads like something broke.
  function emptyHtml() {
    var i, anyHere = false;
    for (i = 0; i < state.addons.length; i++) {
      if (inOrigin(state.addons[i])) { anyHere = true; break; }
    }
    if (anyHere) return '<div class="empty">Nothing matches that.</div>';
    if (state.origin === "custom") {
      return '<div class="hint">A custom store is a folder, a share or a ' +
        'registry your team keeps.<br>Addons published there install exactly ' +
        'like the official ones.<br>' +
        '<button class="primary" id="addstore">Add a store\u2026</button></div>';
    }
    return '<div class="empty">The official gallery could not be read.</div>';
  }

  // ---- the stores panel --------------------------------------------------

  // What a store is FOR, in the row itself. The official one says what cannot be
  // done to it, because "why is there no Remove here" is the question this panel
  // would otherwise leave open.
  function sourceSub(s) {
    var bits = [];
    bits.push(s.builtin ? "official gallery" : (LABEL_KIND[s.kind] || s.kind));
    if (s.builtin) bits.push("cannot be moved or removed");
    else if (s.location) bits.push(s.location);
    if (!s.enabled) bits.push("off");
    return bits.join(SEP);
  }
  var LABEL_KIND = { aefos: "registry over HTTP", path: "folder or share",
                     git: "git repository" };

  function renderSourcesPanel() {
    // Before the CLI has answered there is no count to show, and showing 0
    // would be the one number that is never true: the official store always
    // exists. So the panel says it is still reading.
    var pending = state.sources.length === 0;
    var out = '<div class="panelhead"><h2>Stores</h2>' +
      '<span class="tag">' + (pending ? "reading&hellip;" : state.sources.length) +
      '</span>' +
      '<button class="ghost" id="backtolist">Back to addons</button></div>';
    var i, s;
    for (i = 0; i < state.sources.length; i++) {
      s = state.sources[i];
      out += '<div class="item' + (s.enabled ? "" : " off") + '">' +
        '<div class="meta"><div class="name">' + esc(s.name) + "</div>" +
        '<div class="sub">' + esc(sourceSub(s)) + "</div></div>" +
        '<div class="act">' +
        '<button class="ghost" data-src="' + esc(s.name) + '" data-act="' +
          (s.enabled ? "disable" : "enable") + '">' +
          (s.enabled ? "Turn off" : "Turn on") + "</button>";
      // No Remove on the official gallery: it is not in the file, so there is
      // nothing to remove. Turning it off is the whole of what can be done.
      if (!s.builtin) {
        out += '<button class="ghost" data-src="' + esc(s.name) +
          '" data-act="remove">Remove</button>';
      }
      out += "</div></div>";
    }
    out += '<div class="addform"><h3>Add a store</h3><div class="fields">' +
      '<input type="text" id="srcname" placeholder="name" autocomplete="off">' +
      '<select id="srckind">' +
      '<option value="path">folder or share</option>' +
      '<option value="aefos">registry over HTTP</option></select>' +
      '<input type="text" id="srcloc" placeholder="\\\\server\\addons  or  ' +
      'https://host/registry.json" autocomplete="off">' +
      '<button class="primary" id="srcadd">Add</button></div>' +
      '<div class="why">The name is how you pick this store later ' +
      '(<code>--source name</code>), so it travels without spaces. Addons ' +
      'published here install exactly like the official ones &mdash; except ' +
      'that they are never marked official.</div>' +
      '<div class="bad-inline" id="srcerr" hidden></div></div>';
    document.getElementById("stores").innerHTML = out;
  }

  // One view at a time: the addon list and the stores panel are answers to
  // different questions, and showing both would make the window about neither.
  function applyView() {
    var isStores = state.view === "stores";
    document.getElementById("stores").hidden = !isStores;
    document.getElementById("list").hidden = isStores;
    document.getElementById("head").hidden = isStores;
    document.getElementById("banners").hidden = isStores;
  }

  function render() {
    renderOrigins(); renderStores(); renderTabs(); renderBanners(); renderList();
    renderSourcesPanel(); applyView();
  }

  // ---- events ------------------------------------------------------------
  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim().toLowerCase();
    renderTabs(); renderList();
  });
  document.getElementById("store").addEventListener("change", function (e) {
    state.store = e.target.value; renderTabs(); renderList();
  });
  // Refresh re-reads every store, which on a good day changes NOTHING on screen -
  // and a button that leaves the window identical reads as a button that does not
  // work. So it says it is working, and the host always answers (even when it is
  // busy) so this can never stay stuck.
  function setRefreshing(on) {
    var b = document.getElementById("refresh");
    b.textContent = on ? "Refreshing" + String.fromCharCode(8230) : "Refresh";
    b.disabled = on;
  }

  document.getElementById("refresh").addEventListener("click", function () {
    setRefreshing(true);
    post({ action: "refresh" });
  });
  // BOTH doors into the panel come through here. They were two lines each, and
  // the second door (the "Add a store..." button on an empty Custom tab) only
  // asked the host for the list without switching the view: the answer arrived,
  // the panel filled in behind the addon list, and the button looked dead.
  function openStores() {
    state.view = "stores";
    applyView();
    post({ action: "openSources" });    // the host answers with aefosStore.sources
  }

  document.getElementById("sources").addEventListener("click", openStores);

  document.getElementById("stores").addEventListener("click", function (e) {
    if (e.target.id === "backtolist") {
      state.view = "list"; applyView(); return;
    }
    if (e.target.id === "srcadd") {
      var name = document.getElementById("srcname").value.trim();
      var loc = document.getElementById("srcloc").value.trim();
      var err = document.getElementById("srcerr");
      // Only the two emptiness checks live here. Everything else - the reserved
      // name, a duplicate, a name with a space - is refused by the CLI, which is
      // the one writer and therefore the one place a rule cannot be bypassed.
      if (!name || !loc) {
        err.textContent = "A store needs a name and somewhere to read.";
        err.hidden = false;
        return;
      }
      err.hidden = true;
      post({ action: "sourceAdd", name: name,
             kind: document.getElementById("srckind").value, location: loc });
      return;
    }
    var b = e.target.closest("button[data-src]");
    if (!b) return;
    post({ action: "source" + b.getAttribute("data-act").replace(/^./,
      function (c) { return c.toUpperCase(); }),
      name: b.getAttribute("data-src") });
  });
  document.getElementById("origins").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-origin]");
    if (!b) return;
    state.origin = b.getAttribute("data-origin");
    state.store = "";            // a store filter cannot survive its own tab
    render();
  });
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-kind]");
    if (!b) return;
    state.tab = b.getAttribute("data-kind"); render();
  });
  document.getElementById("list").addEventListener("click", function (e) {
    if (e.target.id === "addstore") { openStores(); return; }
    var b = e.target.closest("button[data-do]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    var cut = id.indexOf("/");
    state.busy = id;
    document.getElementById("log").innerHTML = "";
    document.getElementById("log").className = "on";
    renderList();
    post({ action: b.getAttribute("data-do"),
           source: id.slice(0, cut), slug: id.slice(cut + 1) });
  });

  // ---- what the host calls ----------------------------------------------
  window.aefosStore = {
    data: function (payload) {
      state.addons = (payload && payload.addons) || [];
      state.errors = (payload && payload.errors) || [];
      state.busy = null;
      setRefreshing(false);
      render();
    },

    // The host was already reading when Refresh was pressed. Nothing is wrong,
    // but the button has to come back or it stays "Refreshing" forever.
    refreshed: function () { setRefreshing(false); },
    theme: function (vars) {
      for (var k in vars) {
        if (Object.prototype.hasOwnProperty.call(vars, k)) {
          document.documentElement.style.setProperty("--" + k, vars[k]);
        }
      }
    },
    log: function (line, bad) {
      var el = document.getElementById("log");
      el.className = "on";
      var d = document.createElement("div");
      if (bad) d.className = "bad";
      d.textContent = line;
      el.appendChild(d);
      el.scrollTop = el.scrollHeight;
    },
    done: function () { state.busy = null; renderList(); },

    // The store list, straight from `aefos sources --json`. The panel never
    // keeps its own copy of the truth: every edit goes to the CLI and comes
    // back through here, so what is drawn is what is in the file.
    sources: function (payload) {
      state.sources = (payload && payload.sources) || [];
      renderSourcesPanel();
      applyView();
    },

    // A refusal from the CLI, shown where the attempt was made instead of in
    // the log strip: the person is looking at the form they just submitted.
    sourceError: function (message) {
      var err = document.getElementById("srcerr");
      if (!err) return;
      err.textContent = message;
      err.hidden = false;
    }
  };

  if (window.__AEFOS_STORE__) window.aefosStore.data(window.__AEFOS_STORE__);
  post({ action: "ready" });
})();
</script>
